name: Keep Supabase Awake

on:
  schedule:
    # Free projects pause without a few database requests each day.
    # GitHub often delays a single cron, so this fires three times.
    - cron: "17 4 * * *"
    - cron: "17 12 * * *"
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          for _ in 1 2 3; do
            curl --fail --silent --show-error --max-time 20 \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --output /dev/null \
              --write-out "supabase ping %{http_code}\n" \
              "${SUPABASE_URL%/}/rest/v1/submissions?select=id&limit=1"
          done
